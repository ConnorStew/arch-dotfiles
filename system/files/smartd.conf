# Monitor every ATA/SATA disk found at startup.
#
#   -a                standard set of checks (health, usage attrs, error log)
#   -n standby,q      don't spin up a sleeping disk just to poll it
#   -m <nomailer>     literal keyword: skip email entirely, only run -M exec
#   -M exec ...       desktop notification (no MTA is installed on this host)
#
# Test schedule: smartd does NOT catch up on slots missed while powered off — it
# polls every 30 min and only tests if the clock matches right then. This machine
# is off overnight, so both times are evening/daytime rather than the usual
# small-hours defaults.
#   S/../.././19  short test daily 19:00 (~2 min)
#   L/../../6/13  long test Saturdays 13:00
# A long test on a large HDD takes hours and aborts on shutdown (logged as
# "aborted by the host", harmless). If it keeps aborting, run it by hand instead
# — see notes/disk-health.md section 3.
#   -R 5! -R 187!  track the RAW value of Reallocated_Sector_Ct and
#                  Uncorrectable_Error_Cnt, not just the normalised one. smartd
#                  otherwise only reports normalised changes, which lag badly —
#                  a drive can retire ~11 more blocks before the normalised
#                  value ticks by 1, and the raw count climbing is the thing you
#                  actually want to know about.
#                  The trailing '!' is what makes it a WARNING rather than an
#                  informational log line — without it the change is logged and
#                  -M exec never runs, so no notification. Verified by test.
#                  (-R needs -p/-u/-t to do anything; -a includes -t.)
DEVICESCAN -a -R 5! -R 187! -n standby,q -s (S/../.././19|L/../../6/13) -m <nomailer> -M exec /usr/local/bin/smartd-notify
